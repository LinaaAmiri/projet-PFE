<div class="login-wrapper">

  <div class="login-left">
    <div class="brand">
      <div class="brand-circle">
        <img src="logo.png" alt="Logo" class="brand-logo">
      </div>
      <span class="brand-name">app.Symatique</span>
    </div>

    <div class="left-content">
      <h1>Rejoignez-nous.</h1>
      <p>Créez votre compte en quelques secondes et commencez à explorer notre plateforme.</p>
    </div>
  </div>

  <div class="login-right">
    <div class="login-card">

      <div class="card-header">
        <h2>Créer un compte</h2>
        <p>Inscrivez-vous pour commencer</p>
      </div>

      <form (ngSubmit)="register()" class="login-form" novalidate>

        <div class="form-group">
          <label for="username">Nom d'utilisateur</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input id="username" [(ngModel)]="username" name="username" type="text" placeholder="Choisissez un pseudo" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input id="email" [(ngModel)]="email" name="email" type="email" placeholder="votre@email.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input id="password" [(ngModel)]="password" name="password" type="password" placeholder="Minimum 6 caractères" required>
          </div>
        </div>

        <button type="submit" class="btn-login">
          <span>Créer le compte</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

      </form>

      <p class="register-link">
        Déjà un compte ? <a routerLink="/login">Se connecter</a>
      </p>

    </div>
  </div>

</div>
