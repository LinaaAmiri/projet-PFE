<div class="login-wrapper">

  <div class="login-left">
    <div class="brand">
      <div class="brand-circle">
        <img src="logo.png" alt="Logo" class="brand-logo">
      </div>
      <span class="brand-name">app.Symatique</span>
    </div>

    <div class="left-content">
      <h1>Récupération.</h1>
      <p>Pas d'inquiétude, saisissez votre adresse email et nous vous enverrons un lien pour réinitialiser votre accès.</p>
    </div>
  </div>

  <div class="login-right">
    <div class="login-card">

      <div class="card-header">
        <h2>Mot de passe oublié</h2>
        <p>Entrez vos informations de récupération</p>
      </div>

      <form (ngSubmit)="send()" class="login-form" novalidate>

        <div class="form-group">
          <label for="email">Adresse E-mail</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input
              id="email"
              [(ngModel)]="email"
              name="email"
              type="email"
              placeholder="votre@email.com"
              required
            >
          </div>
        </div>

        <button type="submit" class="btn-login">
          <span>Envoyer le lien</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

      </form>

      <p class="register-link">
        <a routerLink="/login">← Retour à la connexion</a>
      </p>

    </div>
  </div>

</div>
